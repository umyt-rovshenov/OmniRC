; Controllar - a profile driven, multi-protocol universal RC transmitter.
; https://github.com/umyt-rovshenov/Controllar

[platformio]
name = Controllar
default_envs = transmitter

[common]
; Flags shared by every environment. Keep target specific flags out of here.
build_flags =
    -std=gnu++17
    -Wall
    -Wextra
    -Wdouble-promotion
    -DCTL_FIRMWARE_VERSION=\"0.1.0\"
build_unflags =
    -std=gnu++11

; ---------------------------------------------------------------------------
; Transmitter firmware: ESP32-S3-WROOM-1 N16R8 (16 MB flash, 8 MB octal PSRAM)
; ---------------------------------------------------------------------------
[env:transmitter]
platform = espressif32@^7.0.1
board = esp32-s3-devkitc-1
framework = arduino

lib_deps =
    symlink://shared/ControllarProtocol

; N16R8 uses quad SPI flash together with octal SPI PSRAM.
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_build.partitions = default_16MB.csv

; Logging goes to UART0 (GPIO43/44) on the UART USB-C port, which keeps the
; native USB peripheral (GPIO19/20) free for the USB HID gamepad transport.
monitor_speed = 115200
monitor_filters = esp32_exception_decoder, time

build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DBOARD_HAS_PSRAM
    -DARDUINO_USB_MODE=1
    -DARDUINO_USB_CDC_ON_BOOT=0
    -DCORE_DEBUG_LEVEL=3
    -DCTL_LOG_LEVEL=4

; ---------------------------------------------------------------------------
; Host unit tests: everything that does not touch hardware runs here.
; ---------------------------------------------------------------------------
[env:native]
platform = native
test_framework = unity

lib_deps =
    symlink://shared/ControllarProtocol

; The firmware entry point needs the Arduino framework, so keep it out of the
; host build. Tests link only against the portable libraries.
build_src_filter = -<*>

build_unflags = ${common.build_unflags}
build_flags =
    ${common.build_flags}
    -DCTL_PLATFORM_NATIVE
    -DCTL_LOG_LEVEL=5
